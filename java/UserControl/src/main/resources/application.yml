spring:
  application:
    name: UserControl

server:
  port: ${USER_CONTROL_PORT}

keycloak:
  admin:
     server-url: ${KEYCLOAK_URL}
     realm: ${KEYCLOAK_REALM}
     client-id: ${KEYCLOAK_CLIENT_ID}
     client-secret: ${KEYCLOAK_CLIENT_SECRET}

services:
   person:
     url: ${PERSON_SERVICE_URL}